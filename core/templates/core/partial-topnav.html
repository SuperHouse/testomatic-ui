<header class="header header-sticky mb-4">
    <div class="container-fluid">
        {% if user.is_authenticated %}
            <div class="d-flex align-items-center w-100 flex-wrap">
                <button class="header-toggler d-lg-none me-2" type="button" data-coreui-toggle="sidebar" data-coreui-breakpoint="lg" aria-label="Toggle sidebar">
                    <span class="header-toggler-icon"></span>
                </button>
                <ul class="header-nav ms-auto d-flex align-items-center mb-0">
                    <li class="nav-item">
                        <span class="nav-link py-0 d-flex align-items-center">
                            <span class="me-2">{{ operator_display_name }}</span>
                            {% if operator_avatar_url %}
                                <img src="{{ operator_avatar_url }}" class="rounded-circle" alt="{{ operator_display_name }}" style="width: 40px; height: 40px; object-fit: cover;">
                            {% else %}
                                <div class="rounded-circle d-inline-flex align-items-center justify-content-center text-white fw-bold" style="width: 40px; height: 40px; background-color: {{ operator_avatar_color }}; font-size: 16px;">
                                    {{ operator_initials }}
                                </div>
                            {% endif %}
                        </span>
                    </li>
                </ul>
            </div>
        {% endif %}
    </div>
</header>
