{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Testomatic device UI, for testing and programming PCBs on the bench.">
        <title>
            {% block title %}
                Testomatic
            {% endblock title %}
        </title>
        <!-- CoreUI CSS -->
        <link href="https://cdn.jsdelivr.net/npm/@coreui/coreui@4.3.2/dist/css/coreui.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/@coreui/icons@3.0.1/css/all.min.css" rel="stylesheet">
        <!-- Bootstrap Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
        <!-- SimpleBar CSS for sidebar scrolling -->
        <link href="https://cdn.jsdelivr.net/npm/simplebar@latest/dist/simplebar.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/style.css' %}" />
        {% block extra_head %}
        {% endblock extra_head %}
    </head>

    <body>
        <div class="wrapper d-flex flex-row align-items-stretch">
            {% block main %}
                {% block content %}
                {% endblock content %}
            {% endblock main %}
        </div>

        <!-- SimpleBar JS for sidebar scrolling -->
        <script src="https://cdn.jsdelivr.net/npm/simplebar@latest/dist/simplebar.min.js"></script>
        <!-- CoreUI JS -->
        <script src="https://cdn.jsdelivr.net/npm/@coreui/coreui@4.3.2/dist/js/coreui.bundle.min.js"></script>
        <script src="{% static 'js/script.js' %}"></script>

        {% block extra_js %}
        {% endblock extra_js %}
    </body>
</html>
