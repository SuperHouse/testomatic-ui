{% load static %}
<aside class="sidebar sidebar-fixed sidebar-lg-show" id="sidebar">
    <div class="sidebar-brand d-none d-md-flex">
        <a class="sidebar-brand-full" href="https://www.superhouse.tv/" target="_blank" rel="noopener noreferrer">
            <img src="{% static 'img/superhouse.png' %}" alt="SuperHouse" style="max-height: 120px; max-width: 200px; padding: 10px 0;">
        </a>
    </div>
    {% if user.is_authenticated %}
        <ul class="sidebar-nav" data-coreui="navigation" data-simplebar>
            {% with url_name=request.resolver_match.url_name %}
            <li class="nav-item">
                <a class="nav-link {% if url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">
                    <i class="nav-icon cil-speedometer"></i>
                    Dashboard
                </a>
            </li>
            {% if user.is_staff %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'admin:index' %}">
                        <i class="nav-icon cil-settings"></i>
                        Admin
                    </a>
                </li>
            {% endif %}
            {% endwith %}
        </ul>
        <form id="logout-form" method="post" action="{% url 'logout' %}" class="nav-link">
            {% csrf_token %}
            <button type="submit" class="btn btn-link nav-link p-0 text-center w-100 border-0">
                <i class="nav-icon cil-account-logout"></i>
                Logout
            </button>
        </form>
        <div class="sidebar-footer border-top">
            <div class="text-center py-3">
                <a href="https://www.testomatic.io/" target="_blank" rel="noopener noreferrer">
                    <img src="{% static 'img/testomatic-logo-wide-transparent.png' %}" alt="Testomatic.io" style="max-width: 100%; height: auto; padding: 0 10px;">
                </a>
                <div style="font-size: 0.7rem; opacity: 0.5; margin-top: 4px;">
                    <a href="https://github.com/SuperHouse/testomatic-ui" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: none;">v{{ VERSION }}</a>
                </div>
            </div>
        </div>
    {% endif %}
</aside>
